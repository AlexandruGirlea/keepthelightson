name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag matches the package version
        run: |
          version="$(sed -n 's/^version: *//p' apm.yml | tr -d '"'"'")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match apm.yml version $version"; exit 1; }
      - name: Build the integration archives from the tagged source
        run: python3 .github/scripts/build_integrations.py --output "${{ runner.temp }}/klod-integrations"
      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ runner.temp }}"/klod-integrations/*.zip --clobber
